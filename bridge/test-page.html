<!doctype html>
<!--
  Quick check that the bridge works, no React needed.
  Start the bridge (python bridge.py), then double-click this file to open it in a browser.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Canairy bridge test</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 24px; }
    table { border-collapse: collapse; margin-top: 12px; }
    th, td { padding: 6px 12px; border-bottom: 1px solid #333; text-align: left; }
    .bad { color: #ff8a3d; font-weight: 600; }
    button { cursor: pointer; }
  </style>
</head>
<body>
  <h1>Canairy bridge test</h1>
  <div id="status">Connecting to ws://localhost:8080...</div>
  <table>
    <thead><tr><th>ID</th><th>Name</th><th>Source</th><th>Gas</th><th>SOS</th><th>Lost</th><th>Last seen</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <script>
    const workers = {};
    let serial = null;
    let socket;

    function connect() {
      socket = new WebSocket('ws://localhost:8080');
      socket.onopen = () => render();
      socket.onclose = () => { render(); setTimeout(connect, 1000); };
      socket.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'snapshot') { msg.workers.forEach((w) => (workers[w.id] = { ...w, lastSeen: Date.now() })); serial = msg.serial; }
        if (msg.type === 'worker') workers[msg.worker.id] = { ...msg.worker, lastSeen: Date.now() };
        if (msg.type === 'serial') serial = msg.serial;
        render();
      };
    }

    function ack(id) { socket.send(JSON.stringify({ type: 'ack', id })); }

    function render() {
      const up = socket && socket.readyState === WebSocket.OPEN;
      document.getElementById('status').innerHTML = up
        ? `Bridge connected. Arduino: <b>${serial ? serial.state : '?'}</b> ${serial && serial.path ? serial.path : ''}`
        : '<span class="bad">Bridge not connected, retrying...</span>';
      document.getElementById('rows').innerHTML = Object.values(workers)
        .sort((a, b) => a.id - b.id)
        .map((w) => {
          const ago = Math.round((Date.now() - w.lastSeen) / 1000);
          const sos = w.sos ? (w.acknowledged ? 'SOS (seen)' : `<span class="bad">SOS</span> <button onclick="ack(${w.id})">Acknowledge</button>`) : '';
          return `<tr><td>${w.id}</td><td>${w.name}</td><td>${w.source}</td><td>${w.gas}</td><td>${sos}</td><td>${w.lost}</td>
                  <td class="${ago > 5 ? 'bad' : ''}">${ago > 5 ? 'offline, ' : ''}${ago}s ago</td></tr>`;
        })
        .join('');
    }

    connect();
    setInterval(render, 1000);
  </script>
</body>
</html>
